<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <title>SOPRO MAGNÉTICO</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="container">

        <section class="cabecalho">
            <img src="logo_sm.png" alt="Logo SOPRO MAGNÉTICO" class="logo">
            <h1>SOPRO MAGNÉTICO</h1>
            <h2>Controlo Pessoal do Funcionário</h2>

            <p>
                Registe os seus dias de trabalho,
                faltas, férias, folgas e baixa médica.
            </p>
        </section>

        <section class="cartao">

            <h3>Controlo diário</h3>

            <label for="data">Data</label>
            <input
                type="date"
                id="data"
            >

            <label for="situacao">Situação</label>

            <select id="situacao">
                <option value="Presente">Presente</option>
                <option value="Falta">Falta</option>
                <option value="Falta justificada">
                    Falta justificada
                </option>
                <option value="Férias">Férias</option>
                <option value="Baixa médica">
                    Baixa médica
                </option>
                <option value="Folga">Folga</option>
            </select>

            <div id="areaHorario">

                <label for="horario">
                    Horário do dia
                </label>

                <select id="horario">
                    <option value="08:00-17:00">
                        08:00 – 17:00
                    </option>

                    <option value="07:00-15:00">
                        07:00 – 15:00
                    </option>

                    <option value="08:00-17:30">
                        08:00 – 17:30
                    </option>
                </select>

                <div class="horas">

                    <div>
                        <label for="entrada">
                            Entrada
                        </label>

                        <input
                            type="time"
                            id="entrada"
                            value="08:00"
                        >
                    </div>

                    <div>
                        <label for="saida">
                            Saída
                        </label>

                        <input
                            type="time"
                            id="saida"
                            value="17:00"
                        >
                    </div>

                </div>

                <div id="almoco">

                    <div class="horas">

                        <div>
                            <label for="saidaAlmoco">
                                Saída almoço
                            </label>

                            <input
                                type="time"
                                id="saidaAlmoco"
                                value="13:00"
                            >
                        </div>

                        <div>
                            <label for="retornoAlmoco">
                                Regresso almoço
                            </label>

                            <input
                                type="time"
                                id="retornoAlmoco"
                                value="14:00"
                            >
                        </div>

                    </div>

                </div>

                <div class="total">
                    Total trabalhado:
                    <strong id="totalHoras">8h 0min</strong>
                </div>

            </div>

            <label for="observacao">
                Observação
            </label>

            <textarea
                id="observacao"
                rows="3"
                placeholder="Observação opcional"
            ></textarea>

            <button id="guardar">
                GUARDAR REGISTO
            </button>

        </section>

        <section class="botoes">

            <button id="historico">
                HISTÓRICO
            </button>

            <button id="calendario">
                CALENDÁRIO MENSAL
            </button>

            <button id="resumo">
                RESUMO MENSAL
            </button>

        </section>

        <p class="aviso">
            Registo para controlo pessoal do funcionário.
        </p>

    </main>

    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register(
                "service-worker.js"
            );
        }
    </script>

</body>
</html>
